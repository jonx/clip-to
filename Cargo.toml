[package]
name = "clip-to"
version = "2.1.0"
edition = "2021"
description = "Convert the clipboard between plain text, Markdown and rich text, from the command line or a tray hotkey"
authors = ["John Knipper <code@jkn.me>"]
license = "MIT"
repository = "https://github.com/jonx/clip-to"
homepage = "http://jkn.me"

[[bin]]
name = "ct"
path = "src/main.rs"

[dependencies]
global-hotkey = "0.8.0"
htmd = "0.5.5"
muda = "0.20.0"
pulldown-cmark = "0.13.4"
tao = "0.37.0"
tray-icon = { version = "0.25.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSAttributedString", "NSApplication", "NSResponder", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSFont", "NSColor", "NSWorkspace", "NSEvent"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSData", "NSArray", "NSDictionary", "NSRange", "NSAttributedString", "NSError", "NSObject", "NSEnumerator"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }
